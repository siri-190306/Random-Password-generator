<!DOCTYPE html>
<html lang="en">
<head>
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="password-card">
        <h1>🔐 Password Generator</h1>
        <p class="subtitle">Create a strong password in seconds!</p>
        <div class="password-box">
            <input type="text" id="password"
                   placeholder="Your password appears here"
                   readonly>
            <button id="copyBtn" type="button" title="Copy password">
                📋
            </button>
        </div>
        <p id="copyMessage" aria-live="polite"></p>
        <div class="length-section">
            <label for="length">
                Password Length:
                <span id="lengthValue">12</span>
            </label>
            <input type="range" id="length"
                   min="4" max="30" value="12">
        </div>
        <div class="options">
            <label>
                <input type="checkbox" id="uppercase" checked>
                Uppercase letters (A-Z)
            </label>
            <label>
                <input type="checkbox" id="lowercase" checked>
                Lowercase letters (a-z)
            </label>
            <label>
                <input type="checkbox" id="numbers" checked>
                Numbers (0-9)
            </label>
            <label>
                <input type="checkbox" id="symbols" checked>
                Symbols (!@#$...)
            </label>
        </div>
        <p id="errorMessage" role="alert"></p>
        <button id="generateBtn" class="generate-btn" type="button">
            Generate Password ✨
        </button>
        <p class="footer-text">Made with 💗 for your digital safety</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
